  <rect x="0.5" y="0.5" width="63" height="63" rx="5.5" fill="none" stroke="#374151"/>
  <path d="M32 7 L54 14 V31 C54 43.5 44.5 52 32 57 C19.5 52 10 43.5 10 31 V14 Z"
        fill="rgba(0,240,255,0.07)" stroke="#00F0FF" stroke-width="4.5" stroke-linejoin="miter"/>
  <rect x="19" y="23" width="26" height="5.5" fill="#FFFFFF" opacity="0.92"/>
  <rect x="19" y="34" width="26" height="5.5" fill="#00F0FF"/>
</svg>
