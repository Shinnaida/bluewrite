<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- BlueWrite favicon — simplified rendition of the master shield mark
       (see logo.svg): larger shield, thicker strokes, no caret, because
       browser tabs render this at 16px where fine detail turns to mush. -->
