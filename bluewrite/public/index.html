<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="./assets/favicon-CDDPiU3k.png" />
    <!-- Fonts are self-hosted: src/fonts/fonts.css (imported by main.jsx) ships
         League Spartan plus the dashboard families in the bundle, so the station
         LAN needs no internet. There is no public/fonts/ stylesheet — an earlier
         <link href="/fonts/fonts.css"> pointed at a directory that does not
         exist and 404'd on every load. -->
    <title>BlueWrite — Naga City Police Station</title>
    <!-- The display preference, applied BEFORE the bundle paints.
         Without this the first frame is always the light palette and a dark
         workstation flashes white on every load — the bundle is a separate
         request, so by the time src/lib/theme.js runs the page has already
         drawn. Four lines, no dependency, and deliberately a copy of what
         theme.js does rather than an import: this has to be inline and
         synchronous, which is the one thing a module cannot be.
         A missing or unreadable key leaves the attribute off, and the light
         palette in styles.css is the default, so failing here is invisible. -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('bw-theme');
          var theme =
            pref === 'dark' || pref === 'light'
              ? pref
              : pref === 'system'
                ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
                : 'light';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          /* private mode / storage blocked — the light default stands */
        }
      })();
    </script>
    <script type="module" crossorigin src="./assets/index-CI4w-x4b.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-PnWlQa8U.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
