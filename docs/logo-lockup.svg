<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64">
  <!-- BlueWrite horizontal lockup: mark + wordmark. For README, docs,
       splash screens. Transparent background; text colors assume the
       dark HUD theme. Monospace-like spacing echoes the app's HUD type. -->
  <g transform="translate(0,0)">
    <rect width="64" height="64" rx="6" fill="#0A1120"/>
    <rect x="0.5" y="0.5" width="63" height="63" rx="5.5" fill="none" stroke="#374151"/>
    <path d="M32 8 L52 14.5 V30 C52 42 43.5 50 32 55 C20.5 50 12 42 12 30 V14.5 Z"
          fill="rgba(0,240,255,0.07)" stroke="#00F0FF" stroke-width="3.5" stroke-linejoin="miter"/>
    <rect x="20" y="22" width="21" height="4" fill="#FFFFFF" opacity="0.92"/>
    <rect x="20" y="30" width="21" height="4" fill="#FFFFFF" opacity="0.92"/>
    <rect x="20" y="38" width="12" height="4" fill="#00F0FF"/>
    <rect x="35" y="38" width="4" height="4" fill="#00F0FF"/>
  </g>
  <text x="80" y="34" font-family="ui-monospace, 'Cascadia Mono', 'JetBrains Mono', Consolas, monospace"
        font-size="26" font-weight="700" letter-spacing="4"><tspan fill="#FFFFFF">BLUE</tspan><tspan fill="#00F0FF">WRITE</tspan></text>
  <text x="81" y="52" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace"
        font-size="10" font-weight="400" letter-spacing="3.2" fill="#6B7A8C">POLICE INCIDENT REPORTING</text>
</svg>
